<header><h1>🐐 MJ GOAT · NBA Paper Parlays</h1><span class="pill">PAPER ONLY · no bets placed</span>
<span id="upd" class="pill"></span><label class="pill">Book <select id="booksel" onchange="localStorage.book=this.value;render()" style="background:#0d1117;color:#e6edf3;border:1px solid #30363d"></select></label><span id="stale" class="pill"></span>

<script>
let _h=0;const TABS=['Tonight\'s Parlays','Board','Injuries','Ledger / Results','Sources','Method','Results & Learning'];let tab=location.hash=='#learning'?6:0,S=null;
const pct=x=>x==null?'—':(100*x).toFixed(1)+'%', am=x=>x==null?'—':(x>0?'+'+x:''+x), esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function nav(){document.getElementById('nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};render()">${t}</button>`).join('')}
function flags(l){return (l.flags||[]).map(f=>`<span class="flag ${/excluded|heavy|questionable|not weak/.test(f)?'hard':''}">${esc(f)}</span>`).join('')}
function legRow(l,extra){const ev=l.ev;return `<tr><td><b>${esc(l.label)}</b> ${extra||''}<div class="m">${esc(l.game)} · ${esc(l.tip_et)} · ${esc(l.book)}</div></td>
<td>${am(l.price)}</td><td>${l.rating??'—'}</td><td>${pct(l.model_p)}</td><td>${pct(l.novig)}</td><td class="${l.edge>0?'g':'r'}">${(100*l.edge).toFixed(1)}</td>
<td class="${ev>0?'g':'r'}">${(100*ev).toFixed(1)}%</td><td>${l.consistency||'—'}${l.l13?'<div class=m>L13 '+l.l13+'</div>':''}</td><td>${esc(l.confidence)}</td>
<td class="m"><b>APE</b> ${esc(l.lens?.APE)}<br><b>Apotheosis</b> ${esc(l.lens?.Apotheosis)}<br><b>NeoShua</b> ${esc(l.lens?.NeoShua)}<br><b>Counter:</b> ${esc(l.counter)} ${flags(l)}</td></tr>`}
const LH='<tr><th>Leg</th><th>Odds</th><th>Rating</th><th>Model p</th><th>No-vig p</th><th>Edge pts</th><th>EV</th><th>7/9</th><th>Conf.</th><th>Three-lens notes (automated rules, not the reviewer bots)</th></tr>';
function wkHtml(w,title){if(!w)return '';if(typeof w==='string')w={leg:w};if(!w.leg)return '';const sw=w.swap||{};const sc=(w.scores||[]).slice().sort((a,b)=>b.risk-a.risk);
 const swap=sw.type=='drop the leg'?`drop the leg${sw.card_after?` → card ${esc(sw.card_after)} (SGP est. ${esc(sw.card_after_sgp_est)}), joint ${pct(sw.joint_after)}, EV ${(100*sw.ev_after).toFixed(1)}%`:''}${sw.note?' ('+esc(sw.note)+')':''}`:sw.type?`${esc(sw.type)}: <b>${esc(sw.to)}</b>${sw.price!=null?' ('+am(sw.price)+', model '+pct(sw.model_p)+')':''}${sw.note?' ('+esc(sw.note)+')':''}`:'';
 const rec=w.rec||{};const cand=rec.candidate||{};
 const recLine=rec.action?`<br>Recommendation: <b>${esc(rec.action)}</b>${rec.reason?' — '+esc(rec.reason):''}${cand.to?` → <b>${esc(cand.to)}</b>${cand.price!=null?' ('+am(cand.price)+', model '+pct(cand.model_p)+')':''}`:''}${rec.card_after?' · card after drop '+esc(rec.card_after):''}${(rec.other_alters||[]).map(a=>`<br><span class=m>pre-bet ALTER (separate): ${esc(a.of)} → ${esc(a.to)}${a.price!=null?' ('+am(a.price)+')':''}</span>`).join('')}`:'';
 return `<div style="border-left:3px solid #f85149;padding:4px 8px;margin:6px 0;font-size:13px">⚠ <b>${title||'Weakest leg'}:</b> ${esc(w.leg)} · bust risk <b class=r>${w.risk??'—'}</b>/100 <span class=m>(${(w.why||[]).map(esc).join('; ')})</span>${swap?`<br>Safer swap: ${swap}`:''}${recLine}${sc.length?`<div class=m>Bust risk by leg: ${sc.map(x=>esc(x.leg)+' '+x.risk).join(' · ')}</div>`:''}</div>`}

function slipOpen(){try{return new Set(JSON.parse(localStorage.slipOpen||'[]'))}catch(e){return new Set()}}
function tg(el){const sl=el.closest('.slip'),k=sl.dataset.k,o=slipOpen();sl.classList.toggle('open');sl.classList.contains('open')?o.add(k):o.delete(k);localStorage.slipOpen=JSON.stringify([...o])}
function mkt(l){const k=l.kind||l.struct?.kind,st=l.stat||l.struct?.stat,lab=l.label||l.leg||'';const SN={PTS:'Points',REB:'Rebounds',AST:'Assists','3PM':'3-Pointers Made',PRA:'Pts+Reb+Ast',PR:'Pts+Reb',PA:'Pts+Ast',BLK:'Blocks',STL:'Steals'};
 if(k=='ml'||/ ML$/.test(lab))return 'Moneyline';if(k=='spread'||/^[A-Z]{2,4} [+-]\d/.test(lab))return 'Point Spread';if(k=='total'||/ [OU] \d/.test(lab))return 'Game Total';
 if(k=='prop'||/\d\+ /.test(lab)){const m=lab.match(/\d\+\s*(.+)$/);return 'Player '+(SN[(st||'').toUpperCase()]||SN[(m?m[1]:'').trim().toUpperCase()]||(m?m[1]:'Prop'))+' (milestone)'}return ''}
function stCls(x){x=(x||'').toLowerCase();return x=='won'||x=='win'||x=='hit'?'won':x=='lost'||x=='loss'?'lost':/void|push|cancel/.test(x)?'void':'pend'}
function liveOf(g){return LV?.legs?.[(g.matchup||'')+'|'+(g.sel||'')]||null}
function effLeg(g){const lv=liveOf(g);let st=g.status;const fin=stCls(st)!='pend';if(!fin&&lv&&['won','lost','push','void'].includes(lv.status))st=lv.status;return {...g,status:st,lv,isLive:!fin&&lv&&lv.status=='live',lock:!fin&&lv&&lv.status!='live'&&lv.state=='in'}}
function fmtN(x){return x==null?'':(+x).toFixed(1).replace(/\.0$/,'')}
function progBar(g){const lv=g.lv,c=stCls(g.status);const fin=c=='won'||c=='lost'||c=='void';
 const bar=(pct,cls,left,right,mark)=>`<div class=pb><div class=pbt>${mark!=null?`<span class=pbm style="left:${mark}%"></span>`:''}<div class="pbf ${cls}" style="width:${Math.max(0,Math.min(100,pct)).toFixed(1)}%"></div></div><div class=pbl><span>${left}</span><span>${right}</span></div></div>`;
 const col=c=='won'?'won':c=='lost'?'lost':'';
 if(!lv){if(c=='won')return bar(100,'won','','✓ Hit');if(c=='lost')return bar(100,'lost','','✗ Missed');return bar(0,'','Not started','')}
 if(lv.state=='pre'||(lv.cur==null&&lv.diff==null&&!fin)){return bar(0,'',lv.stale||lv.text=='live feed missing'?'<span class=r>Live feed missing'+(LV?.generated_at?' · as of '+esc(LV.generated_at.slice(11,16))+' ET':'')+'</span>':'Not started',lv.text&&lv.text!='Not started'&&lv.text!='live feed missing'?esc(lv.text):'')}
 const clk=lv.state=='in'?' · '+esc(lv.clock||''):lv.state=='post'?' · Final':'';
 const k=lv.kind;
 if(k=='prop'){const pct=lv.line?100*lv.cur/lv.line:0,left=Math.max(0,lv.line-lv.cur);
  return bar(pct,col,`<b>${fmtN(lv.cur)}/${fmtN(lv.line)} ${esc(lv.stat||'')}</b>${clk}`,c=='won'?'✓ Hit':c=='lost'?'✗ Missed by '+fmtN(left):c=='void'?'Void (DNP)':fmtN(left)+' more')}
 if(k=='total'){const pct=lv.line?100*lv.cur/lv.line:0,d=lv.line-lv.cur,ov=lv.side=='over';
  return bar(pct,col,`<b>${fmtN(lv.cur)}/${fmtN(lv.line)} total</b>${clk}`,ov?(c=='won'?'✓ Over hit':c=='lost'?'✗ Stayed under':fmtN(d)+' pts to go'):(c=='lost'?'✗ Passed the cap':c=='won'?'✓ Stayed under':fmtN(d)+' pts of room left'))}
 if(k=='spread'||k=='ml'){const d=lv.diff,m=lv.margin,t=esc(lv.team||'');const lead=d>0?`${t} up ${fmtN(d)}`:d<0?`${t} down ${fmtN(-d)}`:`Tied`;
  const pct=50+Math.max(-50,Math.min(50,(k=='spread'?m:d)*50/20));
  if(k=='ml')return bar(pct,col,`<b>${lead}</b> · ${fmtN(lv.pts)}-${fmtN(lv.opp_pts)}${clk}`,c=='won'?'✓ Won':c=='lost'?'✗ Lost':d>0?'<span class=g>winning by '+fmtN(d)+'</span>':d<0?'<span class=r>losing by '+fmtN(-d)+'</span>':'tied',50);
  const L=lv.line||0,need=L<0?`needs to win by ${Math.floor(-L)+1}+`:`can lose by up to ${Math.ceil(L)-1}`;
  return bar(pct,col,`<b>${lead}</b>, ${need}${clk}`,c=='won'?'✓ Covered':c=='lost'?'✗ Did not cover':c=='void'?'Push':m>0?'<span class=g>covering by '+fmtN(m)+'</span>':m<0?'<span class=r>not covering ('+fmtN(m)+')</span>':'on the number',50)}
 return ''}
function legLine(g0){const g=effLeg(g0);const c=stCls(g.status);const lv=g.lv;
 const lt=lv&&lv.text?`<span class="lvs ${c}">${esc(lv.text)}${g.isLive||g.lock?' · '+esc(lv.clock||''):''}${lv.stale?' · STALE':''}</span>`:'';const ic=c=='won'?'✓':c=='lost'?'✗':c=='void'?'–':'○';
 return `<div class="lg ${c}"><div class=ic>${ic}</div><div class=bd><div class=sel>${esc(g.sel)}${g.isLive?' <span class=livedot>● LIVE</span>':''}${g.lock?' <span class=bdg style="background:#0f3d24;color:#3fb950">HIT</span>':''}${g.weak?' <span class="flag hard">weakest leg</span>':''}</div><div class=mk>${esc(g.market)}${g.matchup?' · '+esc(g.matchup):''}${g.tip?' · '+esc(g.tip):''}</div>${progBar(g)}${g.extra?`<div class=ex>${g.extra}</div>`:''}</div><div class=lo>${g.odds}${g.sub?`<span class=m style="font-size:11px">${g.sub}</span>`:''}</div></div>`}
function gradeOf(cid,leg,st){if(st&&st!='pending')return st;const c=(S.learning?.cards||[]).find(x=>x.id==cid);const l=c?.legs?.find(x=>x.leg==leg);return l?.status||st}
function decOf(a){return a>0?1+a/100:1+100/-a}
function amOf(d){return d>=2?Math.round((d-1)*100):Math.round(-100/(d-1))}
function slip(k,o){const op=slipOpen().has(k)?' open':'';const ef=o.legs.map(effLeg);const nh=ef.filter(x=>stCls(x.status)=='won').length,nb=ef.filter(x=>stCls(x.status)=='lost').length,nl=ef.filter(x=>x.isLive).length;
 const hitTxt=`<span class="hitc${nb?' bust':nh==o.legs.length&&nh?' all':''}">${nh} of ${o.legs.length} hit${nb?' · '+nb+' busted':''}${nl?' · '+nl+' live':''}</span>`;
 return `<div class="slip${op}" data-k="${esc(k)}"><div class=sh onclick="tg(this)"><span class=chev>▶</span><span class=tt>${o.title}</span><span class=nl>${o.n} Leg ${o.n==1?'Bet':'Parlay'}</span>${hitTxt}${(o.badges||[]).filter(b=>b&&b[0]).map(b=>`<span class="bdg ${esc(b[1]||b[0])}">${esc(b[0])}</span>`).join('')}<span class=od>${o.odds||'—'}</span>${o.stake?`<span class=stk>${o.stake}</span>`:''}</div>
 <div class=sb>${o.legs.map(legLine).join('')}${o.body?`<div class=sx>${o.body}</div>`:''}</div></div>`}
function bkOdds(bp,label,i,fallback,fbNote){const c=curBook();let x=null;if(bp&&bp.legs){const r=i!=null&&bp.legs[i]&&(bp.legs[i].label==label||!label)?bp.legs[i]:bp.legs.find(q=>q.label==label);x=r?.prices?.[c]}
 if(x&&x.odds!=null)return {odds:am(x.odds),sub:c+(x.note?' · '+esc(x.note):'')};return {odds:am(fallback),sub:(fbNote||'DK')+(x?.note?' · '+c+': '+esc(x.note):'')}}
function cardOdds(legs){let d=1;for(const l of legs){const a=l.odds??l.odds_american;if(a==null)return null;d*=decOf(a)}return amOf(d)}
function cardStatus(legs){const st=legs.map(l=>stCls(l.status));return st.includes('lost')?'lost':st.length&&st.every(x=>x=='won'||x=='void')?'won':'pending'}
function trackedSlip(c){const TB=(S.tracked_book_prices||{})[c.id];const wk=(c.weakest&&c.weakest.leg)||c.weakest;const amr=c.american??cardOdds(c.legs);const amn=amr==null?null:+amr;const st=c.status||cardStatus(c.legs);
 const kinds=c.lock_kinds||(c.lock_kind?[c.lock_kind]:[]);const lab={unanimous:'Unanimous (real bots)',mj33:'MJ 3/3',two_thirds:'2/3'};
 const lockBadges=kinds.map(k=>[lab[k]||k,k]);
 return slip('t:'+c.id,{title:esc(c.id)+' <span class=m>'+esc(c.source||'')+(c.tier?' · '+esc(c.tier):'')+'</span>',n:c.legs.length,odds:typeof amr=='string'?esc(amr):am(amr),badges:[...lockBadges,[c.locked?'🔒 locked':'not locked','x'],[st,st]],
  stake:amn!=null&&!isNaN(amn)?`Paper $10 → to win $${(10*(decOf(amn)-1)).toFixed(2)}${c.american==null?' (product of locked leg odds)':''}${TB&&TB.best?' · best book: '+esc(TB.best):''}`:'',
  legs:c.legs.map(l=>{const b=bkOdds(TB,l.leg,null,l.odds,'locked');return {sel:l.leg,market:mkt(l),matchup:l.game,status:l.status,weak:wk&&wk==l.leg,odds:b.odds,sub:b.sub,
   extra:[l.model_p!=null?'model '+pct(l.model_p):'',l.edge!=null?'edge '+(100*l.edge).toFixed(1)+' pts':'',l.bust_risk!=null?'bust risk '+Math.round(l.bust_risk):'',l.actual!=null&&l.actual!==''?'actual '+esc(l.actual)+(l.margin!=null?' ('+(l.margin>0?'+':'')+(+l.margin).toFixed(1)+')':''):'',l.close_odds!=null?'close '+am(l.close_odds):'',l.clv_prob!=null?'CLV '+(l.clv_prob>0?'+':'')+(100*l.clv_prob).toFixed(1)+' pts':'',l.cut_by?.length?'<span class=r>cut by '+l.cut_by.join('/')+'</span>':''].filter(Boolean).join(' · ')}}),
  body:(wkHtml(c.weakest,(st==='pending'||st==='open'||st==='live')?'Weakest leg (unplaced lock — recommendation only)':'Weakest leg')||'')+(TB?bookBox(TB,'Price by book (this card)'):'')})}
function parlayCard(t,p,L){if(!p)return `<div class="slip"><div class=sh style="cursor:default"><span class=tt>${t}</span><span class="r" style="font-size:13px">No qualifying parlay right now.</span><span class=stk>${esc((S.build_notes?.[t]||[]).join('; '))}</span></div></div>`;
 const v=p.verdicts||{};const rep=Object.fromEntries((p.replacements||[]).map(r=>[r.new,r]));const bp=p.book_prices;const c=curBook();const bc=bp?.books?.[c];const wk=p.weakest?.leg;
 const legs=p.legs.map((i,j)=>{const l=L[i]||{label:i};const b=bkOdds(bp,l.label,j,l.price,'DK');return {sel:l.label,market:mkt(l),matchup:l.game,tip:l.tip_et,status:l.status,weak:wk==l.label,odds:b.odds,sub:b.sub,
  extra:[l.model_p!=null?'model '+pct(l.model_p):'',l.edge!=null?'edge '+(100*l.edge).toFixed(1)+' pts':'',l.ev!=null?'EV '+(100*l.ev).toFixed(1)+'%':'',p.weakest?.scores?.find(x=>x.leg==l.label)?'bust risk '+p.weakest.scores.find(x=>x.leg==l.label).risk:'',rep[i]?'<span class=repl>replacement for '+esc(rep[i].old)+'</span>':''].filter(Boolean).join(' · ')}});
 const odds=bc&&bc.full&&bc.american!=null?am(bc.american):p.american;
 const vv=['APE','Apotheosis','NeoShua'].map(a=>(v[a]||[])[0]);const nA=vv.filter(x=>x==='APPROVE').length,nD=vv.filter(x=>x==='DOWNGRADE').length,nR=vv.filter(x=>x==='REJECT').length;
 const lb=[];if(nA===3)lb.push(['MJ 3/3','mj33']);if(nA===2&&nD===1&&nR===0)lb.push(['2/3','two_thirds']);
 return slip('p:'+t,{title:t+(p.target&&p.legs.length<p.target?' <span class=y style="font-size:12px">(short: target '+p.target+')</span>':''),n:p.legs.length,odds:odds,badges:[...lb,[v.final,v.final],['pending','pending']],

function svgCurve(curves){const W=640,H=220,P=36;const all=Object.values(curves).flat();if(!all.length)return '<div class=m>No graded cards yet. The curve starts after the first card settles (tonight\'s late games finish about 12:00–12:30 AM ET).</div>';
 const ys=all.map(p=>p.bank),mn=Math.min(...ys,990),mx=Math.max(...ys,1010),nmax=Math.max(...Object.values(curves).map(c=>c.length))-1||1;
 const col=['#f0b429','#58a6ff','#3fb950','#f85149','#bc8cff'];let i=0,leg='';
 const lines=Object.entries(curves).map(([k,c])=>{const cl=col[i++%5];leg+=`<span style="color:${cl}">■ ${esc(k)}</span> `;
  return `<polyline fill="none" stroke="${cl}" stroke-width="2" points="${c.map((p,j)=>`${P+j*(W-2*P)/nmax},${H-P-(p.bank-mn)/(mx-mn)*(H-2*P)}`).join(' ')}"/>`}).join('');
 return `<svg width="${W}" height="${H}" style="background:#0d1117;border:1px solid #30363d"><line x1="${P}" y1="${H-P-(1000-mn)/(mx-mn)*(H-2*P)}" x2="${W-P}" y2="${H-P-(1000-mn)/(mx-mn)*(H-2*P)}" stroke="#30363d" stroke-dasharray="4"/>${lines}<text x="4" y="14" fill="#8b949e" font-size="11">$${mx.toFixed(0)}</text><text x="4" y="${H-P}" fill="#8b949e" font-size="11">$${mn.toFixed(0)}</text><text x="${P}" y="${H-8}" fill="#8b949e" font-size="11">cards settled →  (dashed = $1,000 start)</text></svg><div>${leg}</div>`}
function svgCalib(c){const W=320,H=320,P=34;if(!c.length)return '<div class=m>No graded legs yet.</div>';const X=v=>P+v*(W-2*P),Y=v=>H-P-v*(H-2*P);
 return `<svg width="${W}" height="${H}" style="background:#0d1117;border:1px solid #30363d"><line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="#30363d" stroke-dasharray="4"/>
 ${c.map(b=>`<circle cx="${X(b.pred)}" cy="${Y(b.actual)}" r="${4+Math.sqrt(b.n)*2}" fill="#f0b42988" stroke="#f0b429"><title>${b.bucket}: pred ${pct(b.pred)} actual ${pct(b.actual)} n=${b.n}</title></circle>`).join('')}
 <text x="${W/2-40}" y="${H-6}" fill="#8b949e" font-size="11">predicted p →</text><text x="2" y="14" fill="#8b949e" font-size="11">actual hit ↑</text></svg>`}
function catTable(name,g){const rows=Object.entries(g).sort((a,b)=>(b[1].all.roi??-9)-(a[1].all.roi??-9));if(!rows.length)return '';
 return `<h4>${esc(name)}</h4><table><tr><th>Category</th><th>n</th><th>W-L-P</th><th>Hit</th><th>Pred</th><th>ROI (flat 1u)</th><th>Brier</th><th>Last-13 hit</th><th>Last-13 ROI</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.all.n}${v.all.n<20?' <span class=y>small</span>':''}</td><td>${v.all.won}-${v.all.lost}-${v.all.push}</td><td>${pct(v.all.hit)}</td><td>${pct(v.all.pred)}</td><td class="${v.all.roi>=0?'g':'r'}">${pct(v.all.roi)}</td><td>${v.all.brier==null?'—':v.all.brier.toFixed(3)}</td><td>${pct(v.last13.hit)}</td><td class="${v.last13.roi>=0?'g':'r'}">${pct(v.last13.roi)}</td></tr>`).join('')}</table>`}

function bookBox(bp,title){if(!bp||bp.error||!bp.books)return bp?.error?`<div class=r>book pricing error: ${esc(bp.error)}</div>`:'';const c=curBook();const o=S.book_order||Object.keys(bp.books);
 const cell=b=>{const x=bp.books[b]||{};const t=(x.missing||[]).join('\n');const sel=b==c?'outline:2px solid #d29922;':'';const best=b==bp.best?'background:#12361f;':'';
  return `<td title="${esc(t)}" style="${sel}${best}text-align:center">${x.american!=null?(x.full?'<b>'+am(x.american)+'</b>':'<span class=m>'+am(x.american)+'</span>'):'—'}<br><span class=m style="font-size:11px">${x.priced}/${x.legs} legs${b==bp.best?' · BEST':''}</span></td>`};
 return `<div style="margin:6px 0"><b>${title||'Price by book'}</b> <span class=m>(selected: ${c}; full price only when every leg is quoted; props are DraftKings-only in public feeds; hover for missing legs${bp.started?'; started games use the last pre-tip snapshot, not bettable now':''})</span>
 <table><tr>${o.map(b=>`<th style="text-align:center">${b}</th>`).join('')}</tr><tr>${o.map(cell).join('')}</tr></table>
 <div class=m>Best full-card book: <b>${bp.best||'none (no single book quotes every leg)'}</b>${bp.best_team_legs?` · best on the team legs alone: <b>${bp.best_team_legs}</b> (${am(bp.team_legs_american[bp.best_team_legs])})`:''}</div></div>`}
function trackedBooks(){const T=S.tracked_book_prices||{};const ks=Object.keys(T).filter(k=>!T[k].error);if(!ks.length)return '';const c=curBook();const o=S.book_order||[];
 return `<h2>Per-book prices · today's tracked cards</h2><div class=m>${bookFeed()}</div><table><tr><th>Card</th><th>Tier</th>${o.map(b=>`<th style="text-align:center;${b==c?'color:#d29922':''}">${b}</th>`).join('')}<th>Best book</th></tr>${ks.map(k=>{const v=T[k];return `<tr><td>${esc(k)}</td><td>${esc(v.tier||'')}</td>${o.map(b=>{const x=v.books[b];return `<td title="${esc(x.missing.join('\n'))}" style="text-align:center;${b==c?'outline:2px solid #d29922;':''}${b==v.best?'background:#12361f;':''}">${x.american!=null?(x.full?'<b>'+am(x.american)+'</b>':'<span class=m>'+am(x.american)+'</span>'):'—'} <span class=m style="font-size:11px">${x.priced}/${x.legs}</span></td>`}).join('')}<td>${v.best||'—'}${v.best_team_legs&&v.best_team_legs!=v.best?' <span class=m>(team legs: '+v.best_team_legs+')</span>':''}</td></tr>`}).join('')}</table>`}

function render(){nav();bookSel();const m=document.getElementById('main');if(!S){m.innerHTML='Waiting for first refresh…';return}
 const L=Object.fromEntries((S.legs||[]).map(l=>[l.id,l]));let h='';if([0,3,6].includes(tab)){const ag=LV?.generated_at?Math.round((Date.now()-Date.parse(LV.generated_at.replace(' ET','').replace(' ','T')+'-05:00'))/60000):null;const ng=Object.values(LV?.games||{}).filter(g=>g.state=='in').length;
 h+=LV?`<div class="m ${ag!=null&&ag>3?'r':''}">Live legs: ESPN public boxscore every ${LV.interval_s}s · updated ${esc((LV.generated_at||'').slice(11,16))} ET${ag!=null?' ('+ag+' min ago)':''}${ag!=null&&ag>3?' · STALE':''} · ${ng} game(s) in progress${LV.errors?.length?' · <span class=r>feed failed for '+LV.errors.length+' game(s)</span>':''}. Overs/props flip green the moment the line is reached; unders flip red when passed; ML/spreads settle at final.</div>`:'<div class="m r">Live leg feed missing (data/live.json not available)</div>'}
 if(tab==0){h+=`<div class="m">Eligible (not started) games: ${(S.eligible_games||[]).join(', ')||'none'} · ${S.legs?.length||0} candidate legs · Model lines: DraftKings; per-book prices for FanDuel / DraftKings / BetMGM / Caesars / theScore Bet / Fanatics / Consensus below each card. ${bookFeed()}. Refresh every ${S.next_refresh_min} min.</div>`;
  const Ulocks=(S.learning?.cards||[]).filter(c=>(c.lock_kinds&&c.lock_kinds.length)||c.lock_kind||(c.id||'').startsWith('LOCK-')||(c.source||'').toLowerCase().includes('lock')).sort(lockNewest);const tdy=todayET();const Ltoday=Ulocks.filter(c=>lockDay(c)==tdy);const LS=c=>trackedSlip({...c,id:c.id,source:c.source||'Unanimous LOCK'});const Learlier=Ulocks.filter(c=>lockDay(c)!=tdy);
   h+=`<h2 id=locks-today>🔒 Today's LOCKs · ${tdy} ET <span class=m style="font-size:13px;font-weight:400">paper only · frozen · newest first</span></h2>`+(Ltoday.length?Ltoday.map(LS).join(''):'<div class=m>No locks yet today.</div>');
   h+=`<h2 id=locks-unanimous>🔒 Unanimous LOCKs <span class=m style="font-size:13px;font-weight:400">paper only · tonight's pending build first · earlier below, newest first</span></h2>`;
   h+='<h3 id=locks-pending>Tonight\'s pending build (3 / 6 / 9)</h3><div class=m>Live engine cards — lines are starting points; not locked until the three reviewers agree.</div>'+['Probability','Balanced','Jackpot'].map(t=>parlayCard(t,S.parlays?.[t],L)).join('');
   if(Ltoday.length)h+='<h3>Today\'s pending locks</h3>'+Ltoday.map(LS).join('');
   if(Learlier.length)h+='<h3>Earlier locks</h3>'+Learlier.map(LS).join('');
   h+='<h2>Chill-style build (ML backbone + same-side SGP blocks + heavy-favorite anchors)</h2><div class=m>Structure borrowed from Chill\'s past winning slips (see Results &amp; Learning → Past Wins). Wins-only sample: a structural prior, not proof of edge. Every system bar still applies; SGP-aware pricing.</div>'+parlayCard('Chill-style',S.parlays?.['Chill-style'],L);
  h+=trackedBooks();
  h+='<h2>Original MJ parlays · reviewer consensus</h2><div class=m>Newest first. These are the frozen original builds, not the live engine cards.</div>'+(S.originals||[]).slice().sort(lockNewest).map(o=>origCard(o,L)).join('');
  h+=unanBox()}
 if(tab==1){for(const g of S.games||[]){const ls=(S.legs||[]).filter(l=>l.eid==g.eid);
  h+=`<div class="card"><h3>${g.game} · ${g.tip_et} · ${esc(g.status)} ${g.eligible?'<span class=g>eligible</span>':'<span class=m>not eligible (started/final)</span>'}</h3>`;
  if(g.eligible){h+=`<div class=m>Rest: ${Object.entries(g.rest).map(([k,v])=>k+' '+v).join(' · ')} · model margin (home) ${g.model_margin_home} · ESPN predictor home ${pct(g.bpi_home)} · exp total ${g.exp_total??'—'} · DK line age ${g.dk_age_min??'?'} min · lineups ${g.lineups_confirmed?'<span class=g>confirmed</span>':'<span class=y>pending</span>'}</div>`;
   const bk=Object.entries(g.books||{});if(bk.length)h+='<table><tr><th>Book</th><th>ML A/H</th><th>Spread H</th><th>Total O/U</th><th>Updated</th></tr>'+bk.map(([n,b])=>`<tr><td>${n}</td><td>${am(b.ml_away)} / ${am(b.ml_home)}</td><td>${b.spread_home} (${am(b.spread_home_line)})</td><td>${b.total} (${am(b.over)}/${am(b.under)})</td><td class=m>${esc((b.inserted||'').slice(0,19))}Z</td></tr>`).join('')+'</table>';
   h+='<table>'+LH+ls.sort((a,b)=>b.ev-a.ev).map(l=>legRow(l)).join('')+'</table>'}h+='</div>'}}
 if(tab==2){h+=`<div class=m>ESPN injuries (feed ts ${esc(S.espn_inj_ts)}) cross-checked with NBA official report ${S.nba_ir?.url?'<a style="color:#58a6ff" href="'+S.nba_ir.url+'">'+esc(S.nba_ir.time)+'</a> ('+S.nba_ir.rows+' rows)':'<span class=r>unavailable</span>'}</div>`;
  for(const t of S.injuries||[]){h+=`<div class=card><h3>${t.team} · ${t.game} · ${t.tip_et}</h3><div class=m>Season leaders (ESPN): ${t.season_leaders.join(', ')}</div><table><tr><th>Player</th><th>ESPN</th><th>NBA official</th><th>Note</th></tr>${t.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.espn)}</td><td>${esc(p.nba_official||'—')}</td><td class=m>${esc(p.comment)}</td></tr>`).join('')||'<tr><td colspan=4>none listed</td></tr>'}</table></div>`}}
 if(tab==3){for(const [src,b] of Object.entries(S.bankroll||{}))h+=`<div class=card><h3>${src}</h3>Record ${b.won}-${b.lost} (${b.pending} pending) · staked $${b.staked} · returned $${b.returned} · P&L <b class="${b.pnl>=0?'g':'r'}">$${b.pnl}</b> · ROI ${b.roi==null?'—':pct(b.roi)} · paper bankroll $${b.bankroll} (start $1000, $10 stakes)</div>`;
  for(const [src,led] of Object.entries(S.ledgers||{}))h+=`<h3>${src}</h3>`+led.slice().reverse().map(p=>{const st=p.status||cardStatus(p.legs);const TB=(S.tracked_book_prices||{})[p.parlay_id];
   return slip('l:'+p.parlay_id,{title:esc(p.parlay_id)+' <span class=m>'+esc(p.tier||'')+' · built '+esc(p.built_at||'')+'</span>',n:p.legs.length,odds:esc(p.combined_american),badges:[[p.locked?'🔒 locked':'',''],[p.verdict?.final||(typeof p.verdict=='string'?p.verdict:''),p.verdict?.final||p.verdict],[st,st]],
    stake:p.stake_paper!=null&&p.potential_payout!=null?`Paper $${p.stake_paper} → pays $${p.potential_payout}`:'',
    legs:p.legs.map(l=>{const b=bkOdds(TB,l.leg,null,l.odds_american,'then');return {sel:l.leg,market:mkt(l),matchup:l.game,tip:l.tip,status:gradeOf(p.parlay_id,l.leg,l.status),odds:b.odds,sub:b.sub,extra:[l.model_p!=null?'model '+pct(l.model_p):'',l.book?esc(l.book):''].filter(Boolean).join(' · ')}}),
    body:`<div class=m>Joint ${pct(p.est_joint_p)} vs implied ${pct(p.implied_p)}${p.sgp_note?' · '+esc(p.sgp_note):''}</div>`+(TB?bookBox(TB,'Price by book (this card)'):'')})}).join('')}
 if(tab==4){h+='<table><tr><th>Source</th><th>OK</th><th>Fail</th><th>Last OK</th><th>Last error</th><th>Notes</th></tr>'+Object.entries(S.sources||{}).map(([k,v])=>`<tr><td>${esc(k)}<div class=m>${esc(v.url)}</div></td><td>${v.ok}</td><td class="${v.fail?'r':''}">${v.fail}</td><td>${esc(v.last_ok)}</td><td class=r>${esc(v.last_err)}</td><td class=m>${v.ambiguous_dropped?'ambiguous dropped '+v.ambiguous_dropped+'; ':''}${v.implausible_skipped?'implausible skipped '+v.implausible_skipped:''}${v.report_time?'report '+v.report_time:''}</td></tr>`).join('')+'</table>';
  h+='<div class=m>Fanatics and theScore Bet are requested from Action Network but publish no public prices; DraftKings is the reference line.</div>'}
 if(tab==5){h+=`<div class=card><pre>${esc(S.method||'')}</pre></div>`}
 if(tab==6){h+=learnTab()}
 m.innerHTML=h}
let LV=null;async function pollLive(){try{const r=await fetch('/data/live.json?'+Date.now());if(r.ok)LV=await r.json()}catch(e){}}
async function poll(){try{const r=await fetch('/data/state.json?'+Date.now());S=await r.json();await pollLive();
 const age=(Date.now()/1000-S.generated_epoch)/60;document.getElementById('upd').textContent='Last refresh '+S.generated_at+' ('+age.toFixed(1)+' min ago)';
 const st=document.getElementById('stale');st.textContent=S.stale||age>12?'⚠ STALE since '+(S.stale_since||S.generated_at):'live';st.style.background=S.stale||age>12?'#4a1515':'#0f3d24';
 if(!document.activeElement||document.activeElement.tagName!='INPUT')render()}catch(e){document.getElementById('stale').textContent='⚠ cannot read state.json'}}
poll();setInterval(poll,5000);
