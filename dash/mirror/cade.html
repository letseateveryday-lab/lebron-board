<!doctype html><html><head><script src="./shim.js"></script><meta charset="utf-8"><title>Cade · Trenches</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0d12;--p:#12151d;--p2:#181c26;--b:#232838;--t:#d7dbe6;--m:#7c859b;--g:#2ee59d;--r:#ff5470;--y:#ffcc4d;--c:#5ab4ff;--v:#a07bff}

.badge{padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px;border:1px solid}.paper{color:var(--y);border-color:var(--y);background:#ffcc4d14}.live{color:var(--r);border-color:var(--r)}
.hk{display:flex;gap:16px;flex-wrap:wrap}.hk div{display:flex;flex-direction:column}.hk b{font-size:14px}.hk small{color:var(--m);font-size:10.5px;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--g);box-shadow:0 0 6px var(--g)}.dot.bad{background:var(--r);box-shadow:0 0 6px var(--r)}.dot.warn{background:var(--y);box-shadow:0 0 6px var(--y)}
nav{display:flex;gap:2px;padding:0 14px;background:var(--p);border-bottom:1px solid var(--b);overflow:auto}
nav button{background:none;border:0;color:var(--m);padding:9px 13px;cursor:pointer;font:600 12.5px inherit;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--t);border-color:var(--g)}nav button .n{background:var(--p2);border-radius:8px;padding:0 6px;margin-left:4px;font-size:10.5px}
main{padding:12px 14px}.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:10px 12px}.card small{color:var(--m);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px}.card b{display:block;font-size:18px;margin-top:3px}.card i{font-style:normal;color:var(--m);font-size:11px}
.pnl+{}.up{color:var(--g)}.dn{color:var(--r)}.mut{color:var(--m)}.yel{color:var(--y)}
h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--m)}
table{width:100%;border-collapse:collapse;background:var(--p);border:1px solid var(--b);border-radius:8px;overflow:hidden}
th{position:sticky;top:0;background:var(--p2);color:var(--m);font-weight:600;font-size:10.5px;text-transform:uppercase;text-align:right;padding:7px 8px;white-space:nowrap}
td{padding:6px 8px;border-top:1px solid var(--b);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
tr:hover td{background:#1a1f2b}.tok{display:flex;align-items:center;gap:8px}.tok img,.tok .ph{width:26px;height:26px;border-radius:6px;background:var(--p2);object-fit:cover}
.tok .s{font-weight:700}.tok .mm{color:var(--m);font-size:10.5px}.lk a{margin-left:6px;font-size:10.5px;color:var(--m)}.lk a:hover{color:var(--c)}
.pill{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:700;margin:1px}
.ok{background:#2ee59d1c;color:var(--g)}.no{background:#ff54701f;color:var(--r)}.wa{background:#ffcc4d1c;color:var(--y)}.ne{background:#7c859b22;color:var(--m)}.bu{background:var(--g);color:#000}
.bar{height:5px;background:var(--p2);border-radius:3px;overflow:hidden;min-width:60px}.bar>div{height:100%}
.chart{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:8px}canvas{width:100%;height:240px;display:block}
pre.log{background:#07090d;border:1px solid var(--b);border-radius:8px;padding:10px;max-height:70vh;overflow:auto;font:11.5px/1.45 ui-monospace,monospace;margin:0}
.lb{color:var(--g)}.ls{color:var(--y)}.le{color:var(--r)}.lw{color:var(--v)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1000px){.two{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--p);border:1px solid var(--b);border-radius:6px;padding:6px;min-height:58px;font-size:11px}.cal div b{display:block;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--p);border:1px solid var(--b);border-radius:8px;padding:10px 12px}.kv span:nth-child(odd){color:var(--m)}
.banner{padding:8px 12px;border-radius:6px;margin-bottom:10px;font-weight:600}.banner.r{background:#ff547022;border:1px solid var(--r);color:var(--r)}.banner.y{background:#ffcc4d14;border:1px solid var(--y);color:var(--y)}
.stl{opacity:.38;filter:grayscale(1)}.stag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;font-size:9.5px;font-weight:700;background:#7c859b33;color:#aab;opacity:1;filter:none}.fr{cursor:help}
.tw{overflow:auto;max-height:78vh;border-radius:8px}

/* Live Log · Tape — styled after the paper bot's Mind tab */
#mind-wrap{--mbg:#141821;--mline:#2a3344;--mmut:#8b95a5;--mw:#e8edf5;display:flex;flex-direction:column;gap:10px;font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.mfil{display:flex;flex-wrap:wrap;gap:6px}.mf{background:var(--mbg);border:1px solid var(--mline);color:var(--mmut);border-radius:999px;padding:3px 10px;font:600 11px inherit;cursor:pointer}.mf span{margin-left:6px;opacity:.7}.mf.on{color:var(--mw);border-color:#5aa0ff;background:#5aa0ff22}
#mbox{height:58vh;min-height:260px;overflow-y:auto;background:var(--mbg);border:1px solid var(--mline);border-radius:12px;padding:10px 14px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

#mbox .ml a{font-size:10px;color:var(--mmut);margin-left:4px}#mbox .ml a:hover{color:#5aa0ff}#mbox .ml{margin-right:2px}
#mbox .rep{font-size:10.5px;color:var(--mmut);background:#2a334466;border-radius:4px;padding:0 5px;font-family:ui-monospace,monospace}
.rawb{background:none;border:1px solid var(--mline);color:var(--mmut);border-radius:4px;font:10px ui-monospace,monospace;padding:0 5px;cursor:pointer;margin-left:4px;opacity:.6}.rawb:hover{opacity:1}
#mbox pre.raw{margin:4px 0 2px;padding:6px 8px;background:#0c0e12;border:1px solid var(--mline);border-radius:6px;font:11px/1.45 ui-monospace,monospace;color:var(--mmut);white-space:pre-wrap;word-break:break-all}
#mbox .quiet{color:var(--mmut);padding:40px 0;text-align:center;font-size:15px}
.mline.buy{border-left-color:rgba(46,196,126,.6)!important}.mline.buy .k,.mf.buy{color:#2ec47e}
.mline.tp{border-left-color:rgba(94,200,255,.6)!important}.mline.tp .k,.mf.tp{color:#5ec8ff}
.mline.sell,.mline.trail{border-left-color:rgba(201,162,39,.6)!important}.mline.sell .k,.mline.trail .k,.mf.sell,.mf.trail{color:#c9a227}
.mline.stop,.mline.error{border-left-color:rgba(232,88,88,.65)!important}.mline.stop .k,.mline.error .k,.mf.stop,.mf.error{color:#e85858}
.mline.veto,.mline.system{border-left-color:rgba(139,149,165,.45)!important}.mline.veto .k,.mline.system .k{color:#8b95a5}
.mline.watch{border-left-color:rgba(90,160,255,.5)!important}.mline.watch .k,.mf.watch{color:#5aa0ff}
.mline.halt{border-left-color:rgba(255,170,60,.8)!important}.mline.halt .k,.mf.halt{color:#ffaa3c}
.mline.withdraw{border-left-color:rgba(180,140,255,.6)!important}.mline.withdraw .k,.mf.withdraw{color:#b48cff}
#mind-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px}
.mpanel{background:var(--mbg);border:1px solid var(--mline);border-radius:12px;padding:10px 14px 12px;min-width:0}
.mpanel h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mmut);display:flex;justify-content:space-between;gap:8px}.mpanel h3 .sub{text-transform:none;letter-spacing:0;font-weight:600;opacity:.8}
.mpanel .body{max-height:260px;overflow-y:auto;font-size:12.5px;line-height:1.45;color:#cfd6e2}.mpanel .idea{padding:4px 0;border-bottom:1px solid rgba(42,51,68,.45)}.mpanel .idea:last-child{border-bottom:0}.mpanel .idea .t{color:var(--mmut);font-size:11px;margin-right:8px;display:inline-block;min-width:34px}
.mpanel .chipline{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mmut);font-size:12px;margin-bottom:4px}.mpanel .chipline strong{color:var(--mw)}.mpanel .lbl2{color:var(--mmut);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:8px 0 2px}
</style></head><body>
<header><div class="logo">CADE<span>/trenches</span></div><span id="mode" class="badge paper">PAPER</span>
<span id="eng"></span><div class="hk" id="hk"></div><div style="margin-left:auto" class="mut mono" id="upd"></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const MTAGS=["BUY","SELL","TP","STOP","TRAIL","VETO","WATCH","HALT","WITHDRAW","ERROR","SYSTEM"],MI={BUY:"▲",SELL:"▼",TP:"◎",STOP:"✕",TRAIL:"↘",VETO:"⊘",WATCH:"◉",HALT:"■",WITHDRAW:"⇪",ERROR:"!",SYSTEM:"⚙"},MF=new Set(),MR=new Set();
function mf(t){MF.has(t)?MF.delete(t):MF.add(t);render()}function rt(k){MR.has(k)?MR.delete(k):MR.add(k);render()}
const TABS=[["ov","Overview"],["pos","Open Positions"],["scan","Scanner · Top Now"],["hist","Closed / History"],["cal","PnL Calendar"],["wd","Wallet & Withdrawals"],["cfg","Config & Rules"],["log","Live Log · Tape"]];
let cur=location.hash.slice(1)||"ov",S=null;
const $=s=>document.querySelector(s),E=(v,d=2)=>v==null||isNaN(v)?"—":Number(v).toFixed(d);
const usd=(v,d=2)=>v==null?"—":(v<0?"-$":"$")+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=2,pre="$")=>v==null?"<span class=mut>—</span>":`<span class="${v>0?"up":v<0?"dn":"mut"}">${v>0?"+":v<0?"-":""}${pre}${Math.abs(v).toFixed(d)}</span>`;
const pct=(v,d=1)=>v==null?"<span class=mut>—</span>":`<span class="${v>0?"up":v<0?"dn":"mut"}">${v>0?"+":""}${Number(v).toFixed(d)}%</span>`;
const K=v=>v==null?"—":v>=1e9?"$"+(v/1e9).toFixed(2)+"B":v>=1e6?"$"+(v/1e6).toFixed(2)+"M":v>=1e3?"$"+(v/1e3).toFixed(1)+"K":"$"+Math.round(v);
const N=v=>v==null?"—":v>=1e3?(v/1e3).toFixed(1)+"K":v;
const px=v=>{if(!v)return"—";if(v>=1)return"$"+v.toFixed(4);const s=v.toExponential(3).split("e");const z=-parseInt(s[1])-1;return z>=4?`$0.0<sub>${z}</sub>${(v*10**(z+1)).toFixed(3).replace(".","").slice(0,4)}`:"$"+v.toPrecision(4)};
const age=h=>h==null?"—":h<1?Math.round(h*60)+"m":h<48?h.toFixed(1)+"h":(h/24).toFixed(1)+"d";
const dur=m=>m==null?"—":m<60?Math.round(m)+"m":(m/60).toFixed(1)+"h";
const tm=s=>s?new Date(s).toLocaleString("en-US",{timeZone:"America/Detroit",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}):"—";
const ageS=ts=>ts?(new Date(S.now)-new Date(ts))/1000:null;
const F=(h,ts,src,L,force)=>{const a=ageS(ts),st=force||a==null||a>(L||40);return`<span class="fr${st?" stl":""}" title="${(src||"?").replace(/"/g,"")}${ts?" · "+tm(ts)+" ET · "+Math.round(a)+"s old":" · no timestamp"}">${h}</span>${st?'<span class=stag>stale</span>':""}`};
const short=m=>m.slice(0,4)+"…"+m.slice(-4);
const links=(m,pair)=>`<span class=lk><a target=_blank href="https://dexscreener.com/solana/${pair||m}">DS</a><a target=_blank href="https://solscan.io/token/${m}">Solscan</a><a target=_blank href="https://gmgn.ai/sol/token/${m}">GMGN</a><a target=_blank href="https://rugcheck.xyz/tokens/${m}">RC</a><a href="#" onclick="navigator.clipboard.writeText('${m}');return false" title="copy mint">⧉</a></span>`;
const tok=(t,d)=>`<div class=tok>${d&&d.img?`<img src="${d.img}" loading=lazy onerror="this.style.visibility='hidden'">`:'<div class=ph></div>'}<div><div class=s>${t.sym} ${links(t.mint,d&&d.pair)}</div><div class="mm mono">${short(t.mint)}${typeof t.dex=="string"?" · "+t.dex:t.dex_id?" · "+t.dex_id:""}</div></div></div>`;
const rugp=r=>{if(!r)return'<span class="pill ne">checking…</span>';return`<span class="pill ${r.mint_ok?"ok":"no"}">${r.mint_ok?"✓":"✗"} Mint</span><span class="pill ${r.freeze_ok?"ok":"no"}">${r.freeze_ok?"✓":"✗"} Freeze</span><span class="pill ${r.lp>=95?"ok":r.lp>=50?"wa":"no"}">LP ${Math.round(r.lp)}%</span>${r.rugged?'<span class="pill no">RUGGED</span>':""}`};
const sbar=s=>`<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><b>${E(s,0)}</b><div class=bar style="width:60px"><div style="width:${Math.min(100,s||0)}%;background:${s>=95?"var(--g)":s>=70?"var(--y)":"var(--r)"}"></div></div></div>`;
function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>{let n="";if(S){if(k=="pos")n=S.positions.length;if(k=="scan")n=S.top.length;if(k=="hist")n=S.closed.length;if(k=="wd")n=S.withdrawals.length}return`<button class="${k==cur?"on":""}" onclick="go('${k}')">${l}${n!==""?`<span class=n>${n}</span>`:""}</button>`}).join("")}
function go(k){cur=k;location.hash=k;nav();render()}
function header(){const a=S.acct,c=S.cycle,e=S.engine;$("#mode").textContent=S.mode;$("#mode").className="badge "+(S.mode=="PAPER"?"paper":"live");
const stale=c.age_s>90;$("#eng").innerHTML=`<span class="dot ${!e.running?"bad":stale?"warn":""}"></span>${e.running?"engine pid "+e.pids.join(","):"ENGINE DOWN"} <span class=mut>· cycle ${c.age_s==null?"—":Math.round(c.age_s)+"s ago"}</span>`;
$("#hk").innerHTML=`<div><small>Equity</small><b>${usd(a.equity)}</b></div><div><small>Cash</small><b>${usd(a.cash)}</b></div><div><small>Today</small><b>${sgn(a.pnl_today)}</b></div><div><small>All-time</small><b>${sgn(a.pnl_all)}</b></div><div><small>Open</small><b>${S.positions.length}/${S.config.max_open||"?"}</b></div><div><small>Halt</small><b class="${c.halt||S.kill?"dn":"up"}">${c.halt||(S.kill?"KILL":"none")}</b></div>`;
$("#upd").textContent="updated "+tm(S.now)+" ET"}
function curve(cv){const el=$("#cv");if(!el||!S.curve.length)return;const W=el.clientWidth,H=240,r=devicePixelRatio||1;el.width=W*r;el.height=H*r;const x=el.getContext("2d");x.scale(r,r);
const d=S.curve,ys=d.map(p=>p[1]),st=S.acct.start,mn=Math.min(...ys,st)*0.998,mx=Math.max(...ys,st)*1.002,t0=d[0][0],t1=d[d.length-1][0]||t0+1;
const X=t=>40+(W-50)*(t-t0)/Math.max(1,t1-t0),Y=v=>10+(H-30)*(1-(v-mn)/(mx-mn||1));x.strokeStyle="#232838";x.fillStyle="#7c859b";x.font="10px sans-serif";
for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;x.beginPath();x.moveTo(40,Y(v));x.lineTo(W,Y(v));x.stroke();x.fillText("$"+v.toFixed(2),2,Y(v)+3)}
x.setLineDash([4,4]);x.strokeStyle="#ffcc4d88";x.beginPath();x.moveTo(40,Y(st));x.lineTo(W,Y(st));x.stroke();x.setLineDash([]);
const up=ys[ys.length-1]>=st,col=up?"#2ee59d":"#ff5470",g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,col+"55");g.addColorStop(1,col+"00");
x.beginPath();d.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.strokeStyle=col;x.lineWidth=1.6;x.stroke();x.lineTo(X(t1),H-20);x.lineTo(X(t0),H-20);x.fillStyle=g;x.fill();
x.fillStyle="#7c859b";[t0,(t0+t1)/2,t1].forEach((t,i)=>{const s=new Date(t*1000).toLocaleTimeString("en-US",{timeZone:"America/Detroit",hour:"2-digit",minute:"2-digit",hour12:false});x.fillText(s,i==0?40:i==1?X(t)-14:W-30,H-5)})}
function exitsTbl(ex){const k=Object.keys(ex);return k.length?k.map(w=>`<span class="pill ${/TP|partials/.test(w)?"ok":/stop|rug|liq/.test(w)?"no":"wa"}">${w}: ${ex[w]}</span>`).join(" "):"<span class=mut>no closes yet</span>"}
function statCards(s,l){return`<div class=card><small>${l} closes</small><b>${s.n}</b><i>${s.wins}W / ${s.losses}L</i></div><div class=card><small>${l} win rate</small><b>${s.wr==null?"—":E(s.wr,1)+"%"}</b><i>PF ${s.pf==null?"—":E(s.pf)}</i></div><div class=card><small>${l} realized</small><b>${sgn(s.pnl)}</b><i>best ${sgn(s.best)} · worst ${sgn(s.worst)}</i></div><div class=card><small>${l} avg W / L</small><b>${sgn(s.avg_win)} <span class=mut>/</span> ${sgn(s.avg_loss)}</b></div>`}
const R={
ov(){const a=S.acct,c=S.cycle,src=c.sources||{},bad=Object.entries(src).filter(([k,v])=>v!="ok");
return`${S.kill?'<div class="banner r">KILL file present (/workspace/cade/KILL) — new entries halted</div>':""}${c.halt&&!S.kill?`<div class="banner r">HALT: ${c.halt}</div>`:""}${!S.engine.running?'<div class="banner r">cade.py is not running</div>':""}${S.config.withdraw_address=="SET_ME_SOLANA_ADDRESS"?'<div class="banner y">Live trading not set up: withdraw address is unset and there is no wallet key. Running PAPER only.</div>':""}
<div class=grid><div class=card><small>Mode</small><b class=yel>${S.mode}</b><i>cycle ${S.config.cycle_sec}s (actual ${E(c.cycle_sec_actual,1)}s) · seen ${c.seen} · fee ${c.fee_lamports??"—"} lam</i></div>
<div class=card><small>Equity</small><b>${usd(a.equity)}</b><i>drawdown from peak ${pct(a.dd_from_peak,2)}</i></div><div class=card><small>Cash</small><b>${usd(a.cash)}</b><i>in positions ${usd(a.invested)}</i></div>
<div class=card><small>Start capital</small><b>${usd(a.start)}</b><i>${S.config.start_capital_sol} SOL</i></div><div class=card><small>PnL today</small><b>${sgn(a.pnl_today)}</b><i>day open ${usd(a.day_eq)} · realized ${sgn(a.realized_today)}</i></div>
<div class=card><small>PnL all-time</small><b>${sgn(a.pnl_all)}</b><i>${pct(a.start?a.pnl_all/a.start*100:null,2)} · unreal ${sgn(a.upnl)}</i></div>
<div class=card><small>Halt status</small><b class="${c.halt?"dn":"up"}">${c.halt||"trading"}</b><i>daily-loss floor ${usd(a.daily_floor)}</i></div><div class=card><small>KILL file</small><b class="${S.kill?"dn":"up"}">${S.kill?"PRESENT":"absent"}</b><i>/workspace/cade/KILL</i></div>

function scanMini(){return`<table><tr><th>Token</th><th>MCap</th><th>Liq</th><th>Score</th><th>Status</th></tr>${S.top.map(t=>`<tr><td>${tok(t,t.dex)}</td><td>${K(t.mcap)}</td><td>${K(t.liq)}</td><td>${E(t.score,0)}</td><td>${t.veto?`<span class="pill no">${t.veto}</span>`:t.action=="BUY"?'<span class="pill bu">BUY</span>':`<span class="pill ${t.action=="avoid"?"no":"wa"}">${t.action}</span>`}</td></tr>`).join("")}</table>`}
function render(){if(!S)return;header();const sc=[...document.querySelectorAll(".tw,pre.log,#mbox")].map(e=>[e.scrollTop,e.scrollLeft]);$("#main").innerHTML=`<div class="tab on">${R[cur]()}</div>`;document.querySelectorAll(".tw,pre.log,#mbox").forEach((e,i)=>{if(sc[i]){e.scrollTop=sc[i][0];e.scrollLeft=sc[i][1]}});if(cur=="ov")curve()}
async function poll(){try{const r=await fetch("/api/state",{cache:"no-store"});S=await r.json();const sel=window.getSelection().toString();if(!sel){nav();render()}}catch(e){$("#upd").textContent="dashboard server unreachable"}setTimeout(poll,2500)}
window.onresize=()=>cur=="ov"&&curve();nav();poll();
</script></body></html>
